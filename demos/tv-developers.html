<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发人员任务总览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfb;color:#1f2937;font-family:"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}.screen{height:100dvh;padding:22px 30px;display:grid;grid-template-rows:54px 100px 32px minmax(0,1fr) 22px;gap:12px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dbe5ee}h1{font-size:26px;margin:0}.context{font-size:13px;color:#607086}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-bottom:1px solid #dbe5ee}.stat{padding:10px 22px;border-right:1px solid #edf2f7;display:flex;justify-content:center;flex-direction:column;gap:4px}.stat span{font-size:14px;color:#607086}.stat b{font-size:32px;font-weight:600;color:#0f9488}.section-head{display:flex;align-items:center;justify-content:space-between}h2{font-size:18px;margin:0}.legend{display:flex;gap:15px;font-size:12px;color:#607086}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;background:var(--color)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;min-height:0}.person{background:white;border:1px solid #dbe5ee;border-radius:6px;min-width:0;padding:12px;display:grid;grid-template-rows:24px minmax(30px,1fr) 7px 29px;gap:7px}.person-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.person-head b{font-size:18px}.person-head span{font-size:11px;color:#8a99ad}.completion{display:flex;justify-content:space-between;align-items:center;gap:4px}.completion strong{font-size:30px;line-height:1;font-variant-numeric:tabular-nums;font-weight:600}.completion strong small{font-size:14px;margin-left:2px}.completion>span{font-size:12px;color:#607086;text-align:right;line-height:1.5}.track{display:flex;width:100%;height:7px;background:#edf2f7;border-radius:3px;overflow:hidden}.track i{height:100%}.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;border-top:1px solid #edf2f7;padding-top:7px;font-size:11px;color:#607086;white-space:nowrap}.counts b{font-size:13px;color:#34434b}.counts .blocked b{color:#dc434a}footer{display:flex;justify-content:space-between;color:#607086;font-size:12px}.screen a{color:#0f9488;text-decoration:none}a:hover{text-decoration:underline}
@media(min-width:2000px){.screen{padding:32px 44px;grid-template-rows:64px 130px 38px minmax(0,1fr) 28px;gap:18px}h1{font-size:34px}.stat b{font-size:42px}.stat span,.legend,.context{font-size:17px}.person{padding:18px;grid-template-rows:30px minmax(40px,1fr) 10px 38px;gap:10px}.person-head b{font-size:23px}.person-head span,.completion>span{font-size:15px}.completion strong{font-size:40px}.counts{font-size:14px}.counts b{font-size:17px}.track{height:10px}}
@media(max-width:1399px),(max-height:799px){.screen{height:auto;min-height:100dvh;grid-template-rows:54px 100px 32px auto 24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:158px}}
@media(max-width:899px){.screen{padding:16px;grid-template-rows:54px auto auto auto 40px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:85px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{align-items:start;gap:8px;flex-direction:column}.context{font-size:11px}.legend{flex-wrap:wrap;gap:8px}}
@media(max-width:639px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:21px}.context{display:none}.counts{font-size:10px}.person{padding:9px}.stat{padding:10px}.stat b{font-size:26px}.stat span{font-size:12px}footer{flex-wrap:wrap;gap:4px}}
@media(max-width:359px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="screen">
<header><h1>开发人员任务总览</h1><span class="context">在建项目 · 示例数据 · 24 人</span></header>
<section class="stats" id="stats"></section>
<div class="section-head"><h2>人员进展</h2><div class="legend" id="legend"></div></div>
<section class="grid" id="people" aria-label="开发人员任务完成情况"></section>
<footer><span>示例数据 · 完成率 = 已完成 / 总任务 · 待验收不计入完成</span><a href="tv-card.html">项目视图 →</a></footer>
</main><script>
const names=['李明','王晨','周宁','陈颖','赵阳','刘欣','张帆','孙悦','吴磊','郑敏','钱程','何静','林涛','徐敏','陆洋','高翔','沈佳','唐杰','周航','杨帆','许宁','陈曦','王悦','刘洋'];
// Each row is [done, active, review, blocked, todo].
const tasks=[[18,4,2,1,0],[27,5,3,0,5],[14,6,4,2,4],[32,3,3,0,2],[9,8,2,1,5],[22,4,2,0,2],[16,5,2,0,2],[8,4,2,0,6],[24,4,1,1,0],[11,3,2,0,4],[19,5,3,0,3],[26,2,2,0,0],[7,6,3,2,2],[13,4,1,0,2],[20,4,4,0,2],[15,5,2,1,2],[31,3,2,0,4],[10,2,1,0,2],[17,6,2,0,0],[23,3,1,1,2],[6,4,2,0,3],[28,5,2,0,0],[12,4,2,0,2],[21,5,2,1,1]];
const colors=['#14b8a6','#1677ff','#faad14','#ff4d4f','#d5dce4'];
const labels=['已完成','进行中','待验收','阻塞','待办'];
const sums=tasks.reduce((a,row)=>a.map((n,i)=>n+row[i]),[0,0,0,0,0]);
const total=sums.reduce((a,b)=>a+b,0);
document.querySelector('#stats').innerHTML=[['开发人员',names.length+' 人'],['任务总数',total+' 项'],['整体完成率',Math.round(sums[0]/total*100)+'%'],['待验收',sums[2]+' 项'],['阻塞任务',sums[3]+' 项']].map(([label,value])=>`<div class="stat"><span>${label}</span><b>${value}</b></div>`).join('');
document.querySelector('#legend').innerHTML=labels.map((s,i)=>`<span><i style="--color:${colors[i]}"></i>${s}</span>`).join('');
document.querySelector('#people').innerHTML=names.map((name,i)=>{
const row=tasks[i],sum=row.reduce((a,b)=>a+b,0),pct=Math.round(row[0]/sum*100);
return `<article class="person"><div class="person-head"><b>${name}</b><span>${String(i+1).padStart(2,'0')}</span></div><div class="completion"><strong>${pct}<small>%</small></strong><span>已完成 ${row[0]} / ${sum}<br>项任务</span></div><div class="track" role="img" aria-label="${labels.map((s,j)=>s+row[j]+'项').join('，')}">${row.map((n,j)=>`<i style="width:${n/sum*100}%;background:${colors[j]}"></i>`).join('')}</div><div class="counts"><span>进行 <b>${row[1]}</b></span><span>验收 <b>${row[2]}</b></span><span class="${row[3]?'blocked':''}">阻塞 <b>${row[3]}</b></span><span>待办 <b>${row[4]}</b></span></div></article>`;
}).join('');
</script></body></html>
